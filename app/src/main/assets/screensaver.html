<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screensaver — Gargantua</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #hint{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
    font:500 12px/1 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(255,255,255,.32);pointer-events:none;
    transition:opacity 1.4s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Screen saver preview</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', {alpha:false});
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// PERF: cap the canvas backing resolution (the panel upscales it). A dim screensaver
// does not need native 4K, and this is the biggest single throughput lever on this GPU.
const CAP_W = 960;

let W,H,S,cx,cy,DPR;
function resize(){
  const winW = innerWidth, winH = innerHeight;
  W = cv.width  = Math.min(Math.round(winW * (window.devicePixelRatio || 1)), CAP_W);
  H = cv.height = Math.max(1, Math.round(W * winH / winW));
  DPR = W / winW;                     // backing px per CSS px, used for element sizing
  S = Math.min(W,H) * 0.8;            // world -> pixels
  cx = W/2; cy = H/2;
  buildHoleGradient();
}

/* ---------------- config ---------------- */
const G        = 3e-6;     // gravity strength
const Rh       = 0.10;     // event horizon (world units)
const R_in     = 0.13;     // disk inner edge
const R_out    = 0.48;     // disk outer edge
const R_spawn  = 1.30;     // where infalling matter is born
const TILT      = 72 * Math.PI/180;   // viewing inclination (near edge-on)
const SIN = Math.sin(TILT), COS = Math.cos(TILT);
const N        = 2800;
const diskDrain= 0.0006;   // gentle accretion, applied ONLY to matter in the disk
const kPlane   = 0.0012;   // pull toward disk plane near the hole
const planeDmp = 0.03;     // vertical damping near the hole
const SPEED    = reduce ? 0.35 : 1;
const LUMA     = 0.72;     // global luminance cap for OLED safety (lower = dimmer/safer)

/* ---------------- helpers ---------------- */
function rand(a,b){return a + Math.random()*(b-a);}
function vcirc(r){return Math.sqrt(G/r);}

// temperature ramp by normalized radius t (0 inner .. 1 outer)
const STOPS = [
  [0.00, [205,226,255]],   // blue-white hot (inner)
  [0.16, [255,251,240]],   // white
  [0.42, [255,201,120]],   // gold
  [0.70, [255,126,55]],    // orange
  [1.00, [214,66,28]]      // ember red
];
function ramp(t){
  t = t<0?0:t>1?1:t;
  for(let i=1;i<STOPS.length;i++){
    if(t<=STOPS[i][0]){
      const a=STOPS[i-1], b=STOPS[i];
      const f=(t-a[0])/(b[0]-a[0]);
      return [a[1][0]+(b[1][0]-a[1][0])*f, a[1][1]+(b[1][1]-a[1][1])*f, a[1][2]+(b[1][2]-a[1][2])*f];
    }
  }
  return STOPS[STOPS.length-1][1];
}

/* ---------------- PERF: precomputed colour LUT + cached style strings ----------------
   The hot loop must not allocate. Colours come from a fixed LUT; rgba() strings are
   built once per (colour, alpha) bucket and reused, so steady-state allocation ~ 0. */
const NC = 96, NA = 40, AMAX = 0.5;
const lutR = new Uint8Array(NC), lutG = new Uint8Array(NC), lutB = new Uint8Array(NC);
for(let i=0;i<NC;i++){ const c = ramp(i/(NC-1)); lutR[i]=c[0]|0; lutG[i]=c[1]|0; lutB[i]=c[2]|0; }
const pCache = new Array(NC*NA);
function pStyle(ci, a){
  let ai = (a / AMAX * (NA-1) + 0.5) | 0;
  if(ai < 0) ai = 0; else if(ai >= NA) ai = NA-1;
  const k = ci*NA + ai;
  let s = pCache[k];
  if(s === undefined){
    const av = (ai/(NA-1))*AMAX;
    s = 'rgba('+lutR[ci]+','+lutG[ci]+','+lutB[ci]+','+av.toFixed(3)+')';
    pCache[k] = s;
  }
  return s;
}
function ringCacheFactory(r,g,b){
  const cache = new Array(NA);
  return function(a){
    let ai = (a / AMAX * (NA-1) + 0.5) | 0;
    if(ai < 0) ai = 0; else if(ai >= NA) ai = NA-1;
    let s = cache[ai];
    if(s === undefined){ s = 'rgba('+r+','+g+','+b+','+((ai/(NA-1))*AMAX).toFixed(3)+')'; cache[ai]=s; }
    return s;
  };
}
const ringInner = ringCacheFactory(255,232,198);
const ringOuter = ringCacheFactory(255,205,150);

let holeGrad = null;
function buildHoleGradient(){
  const rPx = Rh*S;
  // centred at origin; drawHole translates the context to the hole's drifting position.
  holeGrad = ctx.createRadialGradient(0,0,rPx*0.6, 0,0,rPx*3.2);
  holeGrad.addColorStop(0,`rgba(255,170,90,${0.10*LUMA})`);
  holeGrad.addColorStop(0.5,`rgba(255,120,60,${0.03*LUMA})`);
  holeGrad.addColorStop(1,'rgba(0,0,0,0)');
}

resize();
addEventListener('resize', resize);

/* ---------------- particles ---------------- */
const P = new Array(N);
function randUnit(){
  const u=Math.random()*2-1, th=Math.random()*Math.PI*2, s=Math.sqrt(1-u*u);
  return [s*Math.cos(th), s*Math.sin(th), u];
}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];}
function norm(v){const m=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/m,v[1]/m,v[2]/m];}
function spinAxis(){return norm([rand(-0.55,0.55), rand(-0.55,0.55), 1]);}

function seedDisk(p){
  const ang = Math.random()*Math.PI*2;
  const rr  = R_in + (R_out-R_in)*Math.pow(Math.random(),1.4);  // denser inner
  p.x = rr*Math.cos(ang); p.y = rr*Math.sin(ang); p.z = rand(-0.01,0.01)*rr;
  const v = vcirc(rr);
  p.vx = -Math.sin(ang)*v; p.vy = Math.cos(ang)*v; p.vz = 0;
}
function seedInfall(p){
  const dir = randUnit();
  const rr  = rand(0.55, R_spawn);
  p.x=dir[0]*rr; p.y=dir[1]*rr; p.z=dir[2]*rr;
  const axis = spinAxis();
  let t = norm(cross(axis, dir));
  const v = vcirc(rr) * rand(0.62, 0.82);   // eccentric: dives in toward the disk
  p.vx=t[0]*v; p.vy=t[1]*v; p.vz=t[2]*v;
}
function respawn(p){
  const dir=randUnit(), rr=rand(R_out*1.3, R_spawn);
  p.x=dir[0]*rr; p.y=dir[1]*rr; p.z=dir[2]*rr;
  const axis=spinAxis(); let t=norm(cross(axis,dir));
  const v=vcirc(rr)*rand(0.62,0.82);
  p.vx=t[0]*v; p.vy=t[1]*v; p.vz=t[2]*v;
}
for(let i=0;i<N;i++){
  const p={};
  if(i < N*0.55) seedDisk(p); else seedInfall(p);
  P[i]=p;
}

/* ---------------- simulation (unchanged) ---------------- */
function step(dt){
  for(let i=0;i<N;i++){
    const p=P[i];
    const r2=p.x*p.x+p.y*p.y+p.z*p.z+1e-6;
    const r=Math.sqrt(r2);
    const inv=G/(r2*r);
    let ax=-inv*p.x, ay=-inv*p.y, az=-inv*p.z;
    const f = Math.max(0, Math.min(1, (R_out*1.1 - r)/(R_out*1.1)));
    az += -kPlane * p.z * f;
    p.vx += ax*dt; p.vy += ay*dt; p.vz += az*dt;
    p.vz *= (1 - planeDmp*f);
    if(p.z*p.z < 0.0036 && r < R_out){
      const d = 1 - diskDrain*dt;
      p.vx *= d; p.vy *= d; p.vz *= d;
    }
    p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
    if(r < Rh*0.92 || r > R_spawn*1.25) respawn(p);
  }
}

/* ---------------- render ---------------- */
const vref = vcirc(0.25);

function drawHole(ox,oy,t){
  const rPx = Rh*S;
  // soft warm back-glow (cached gradient, translated into place)
  ctx.globalCompositeOperation='lighter';
  ctx.save(); ctx.translate(ox,oy);
  ctx.fillStyle=holeGrad;
  ctx.beginPath(); ctx.arc(0,0,rPx*3.2,0,7); ctx.fill();
  ctx.restore();

  // event horizon: solid black, occludes whatever is behind it
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.arc(ox,oy,rPx,0,7); ctx.fill();

  // rotating bright photon-ring hotspot (no pixel stays bright for long)
  ctx.globalCompositeOperation='lighter';
  const segs=72, phase=t*0.00035;
  for(let i=0;i<segs;i++){
    const a0=i/segs*Math.PI*2, a1=(i+1)/segs*Math.PI*2, mid=(a0+a1)*0.5;
    const lobe=Math.pow(0.55+0.45*Math.cos(mid-phase),2);
    ctx.beginPath(); ctx.arc(ox,oy,rPx*1.04,a0,a1);
    ctx.lineWidth=2.0*DPR;
    ctx.strokeStyle=ringInner(LUMA*(0.07+0.34*lobe));
    ctx.stroke();
    ctx.beginPath(); ctx.arc(ox,oy,rPx*1.16,a0,a1);
    ctx.lineWidth=4.0*DPR;
    ctx.strokeStyle=ringOuter(LUMA*(0.02+0.12*lobe));
    ctx.stroke();
  }
}

function render(t){
  const driftX = (Math.sin(t*0.00005)*0.11 + Math.sin(t*0.000019+0.7)*0.05) * W;
  const driftY = (Math.sin(t*0.000061+1.3)*0.07 + Math.sin(t*0.000023+2.1)*0.04) * H;
  const ox = cx + driftX, oy = cy + driftY;

  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.fillRect(0,0,W,H);

  for(let pass=0; pass<2; pass++){
    if(pass===1) drawHole(ox,oy,t);
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<N;i++){
      const p=P[i];
      const yr = p.y*COS - p.z*SIN;
      const zr = p.y*SIN + p.z*COS;
      if(pass===0 ? zr>=0 : zr<0) continue;

      const sx = ox + p.x*S;
      const sy = oy + yr*S;
      if(sx<-4||sx>W+4||sy<-4||sy>H+4) continue;

      const r = Math.sqrt(p.x*p.x+p.y*p.y+p.z*p.z);
      let tt = (r - Rh)/(R_out - Rh); if(tt<0)tt=0; else if(tt>1)tt=1;

      const pf = Math.exp(-(p.z*p.z)/(0.0045));
      let a = (0.85 - 0.6*tt) * (0.25 + 0.75*pf);
      a *= Math.max(0.12, Math.min(1, 1.25 - r/R_spawn));
      const vzr = p.vy*SIN + p.vz*COS;
      a *= 1 + 0.7*Math.max(-1,Math.min(1, vzr/vref));
      a *= LUMA;
      if(a<=0.012) continue;
      if(a>AMAX) a=AMAX;

      const ci = (tt*(NC-1))|0;
      const size = (0.7 + 1.1*pf*(1-tt*0.6)) * DPR;
      ctx.fillStyle = pStyle(ci, a);
      ctx.beginPath();
      ctx.arc(sx,sy,size,0,7);
      ctx.fill();
    }
  }

  // dim drifting clock
  const now=new Date();
  const hh=String(now.getHours()).padStart(2,'0'), mm=String(now.getMinutes()).padStart(2,'0');
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(220,228,240,0.16)';
  ctx.font = `300 ${26*DPR}px system-ui, sans-serif`;
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  const clkX = W*0.5 + Math.sin(t*0.00005)*W*0.04;
  const clkY = H*0.86 + Math.sin(t*0.00006+2)*H*0.03;
  ctx.fillText(`${hh}:${mm}`, clkX, clkY);
}

/* ---------------- loop ---------------- */
let last=performance.now();
function frame(now){
  const dt = Math.min(2.2, (now-last)/16.667) * SPEED;
  last=now;
  const sub=2;
  for(let s=0;s<sub;s++) step(dt/sub);
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

setTimeout(()=>{document.getElementById('hint').style.opacity='0';}, 3200);
</script>
</body>
</html>
